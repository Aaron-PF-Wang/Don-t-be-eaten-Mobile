<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>非此即彼</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=DM+Mono:wght@400;500&display=swap');
:root{color-scheme:light;--ink:#171919;--paper:#f5f5f2;--red:#ef4b3f;--ice:#a9c7c9}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7d9d5;color:var(--ink);font-family:"DM Mono",ui-monospace,monospace}
body{display:grid;place-items:center}
.shell{position:relative;width:min(100vw,1600px);height:min(100vh,1000px);min-height:500px;background:#ecece7;overflow:hidden;box-shadow:0 22px 80px #20292933}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.topbar{position:absolute;top:24px;left:30px;right:30px;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
.status-stack{display:flex;flex-direction:column;align-items:flex-end}
.egg-count{padding:11px 16px;border:1.5px solid var(--ink);background:#f7f7f2;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.egg-count b{font-size:22px}
.hit-message{position:absolute;top:88px;left:50%;z-index:3;width:min(820px,calc(100% - 220px));transform:translateX(-50%);color:var(--ink);font-family:"ZCOOL KuaiLe",sans-serif;font-size:clamp(32px,3.5vw,50px);line-height:1.4;text-align:center;text-wrap:balance;-webkit-text-stroke:1px #fff;text-shadow:.5px 0 #fff,-.5px 0 #fff,0 .5px #fff,0 -.5px #fff;opacity:0;transition:opacity .25s;pointer-events:none}
.hit-message.single-line{width:calc(100% - 24px);max-width:none;white-space:nowrap;text-wrap:nowrap;font-size:clamp(18px,2.6vw,36px)}
.hit-message.show{opacity:1}
.launch-screen{position:absolute;inset:0;z-index:10;background:#000;overflow:hidden;opacity:1;transition:opacity .7s ease}
.launch-screen.done{opacity:0;pointer-events:none}
.launch-layer{position:absolute;inset:3%;width:94%;height:94%;object-fit:fill;object-position:center;pointer-events:none}
.launch-background{inset:3%;width:94%;height:94%;object-fit:fill}
.launch-title,.launch-title-glow{top:1%;bottom:5%;height:94%}
.launch-prompt,.launch-prompt-glow{top:5%;bottom:1%;height:94%}
.launch-title{transform:translateY(-100%);animation:launch-title-in 1.35s cubic-bezier(.2,.8,.25,1) forwards}
.launch-prompt{transform:translateY(100%);animation:launch-prompt-in .9s .65s cubic-bezier(.2,.8,.25,1) forwards}
.launch-title-glow,.launch-prompt-glow{opacity:0}
.launch-screen.lit .launch-title,.launch-screen.lit .launch-prompt{opacity:0;transition:opacity .08s linear}
.launch-screen.lit .launch-title-glow,.launch-screen.lit .launch-prompt-glow{opacity:1}
.launch-screen.leaving{opacity:0}
@keyframes launch-title-in{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@keyframes launch-prompt-in{from{transform:translateY(100%)}to{transform:translateY(0)}}
.veil{position:absolute;inset:0;z-index:4;background:#f5f5f2d9;display:grid;place-items:center;transition:opacity .35s}
.veil.hide{opacity:0;pointer-events:none}
.fried-egg-drop{position:absolute;left:50%;top:0;z-index:1;width:min(38%,380px);height:auto;opacity:0;pointer-events:none;transform:translate(-50%,-110%) rotate(-14deg)}
.fried-egg-drop.show{opacity:1}
.story{position:absolute;inset:0;z-index:5;background:#000;color:#f5f5f2;display:grid;place-items:center;padding:30px;text-align:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .65s,visibility 0s linear .65s}
.story.show{visibility:visible;transition:opacity .65s}
.story.visible{opacity:1;pointer-events:auto}
.story-text{max-width:80%;font-size:clamp(16px,2vw,26px);line-height:1.8;letter-spacing:0}
.modal-stage{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(420px,calc(100% - 40px))}
.modal-note{display:none;color:var(--ink);font:clamp(28px,3.5vw,42px) "ZCOOL KuaiLe",sans-serif;white-space:nowrap;text-shadow:0 1px #fff}
.modal-note.show{display:block}
.modal{width:min(420px,calc(100% - 40px));padding:30px 32px 26px;border:2px solid var(--ink);background:var(--paper);box-shadow:8px 8px 0 var(--ink);text-align:center}
.modal .eyebrow{font-size:10px;color:#777;margin-bottom:10px}
.modal h1{font:40px "ZCOOL KuaiLe",sans-serif;margin:0 0 8px}
.modal p{font-size:11px;line-height:1.8;color:#555;margin:0 0 22px}
.paint-panel{position:absolute;left:22px;top:50%;z-index:6;display:flex;flex-direction:column;gap:18px;transform:translateY(-50%);opacity:0;pointer-events:none;transition:opacity .25s}
.paint-panel.show{opacity:1;pointer-events:auto}
.paint-tools{display:flex;flex-direction:column;gap:8px}
.paint-tool{min-width:112px;padding:10px 12px;background:#f7f7f2;color:var(--ink);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:13px}
.paint-tool:hover:not(:disabled){transform:translate(-2px,-2px)}
.paint-tool:disabled{opacity:.28;cursor:not-allowed;box-shadow:2px 2px 0 #777}
.paint-tool.available[data-color="#ef4b3f"]{background:#ef4b3f;color:#fff}
.paint-tool.available[data-color="#78a33d"]{background:#78a33d;color:#fff}
.paint-tool.available[data-color="#f0bd3c"]{background:#f0bd3c;color:var(--ink)}
.paint-tool.available[data-color="#4c70bd"]{background:#4c70bd;color:#fff}
.paint-tool.selected{color:#fff;box-shadow:3px 3px 0 var(--red)}
.paint-tool[data-color="#ef4b3f"].selected{background:#ef4b3f}
.paint-tool[data-color="#78a33d"].selected{background:#78a33d}
.paint-tool[data-color="#f0bd3c"].selected{background:#f0bd3c;color:var(--ink)}
.paint-tool[data-color="#4c70bd"].selected{background:#4c70bd}
.paint-confirm{padding:10px 18px}
button{appearance:none;border:0;background:var(--ink);color:white;font:14px "ZCOOL KuaiLe",sans-serif;padding:12px 26px;cursor:pointer;box-shadow:4px 4px 0 var(--red);transition:transform .12s}
button:hover{transform:translate(-2px,-2px)}
button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--red)}
.mobile-controls{position:absolute;inset:0;z-index:7;opacity:1;transition:opacity .2s;pointer-events:none}
.mobile-controls.is-hidden{opacity:0;pointer-events:none}
.mobile-dpad,.mobile-actions{position:absolute;bottom:clamp(18px,6vh,64px);pointer-events:auto}
.mobile-dpad{left:clamp(14px,4vw,48px);display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.mobile-dpad [data-key="w"]{grid-column:2;grid-row:1}
.mobile-dpad [data-key="a"]{grid-column:1;grid-row:2}
.mobile-dpad [data-key="s"]{grid-column:2;grid-row:2}
.mobile-dpad [data-key="d"]{grid-column:3;grid-row:2}
.mobile-actions{right:clamp(14px,4vw,48px);display:grid;grid-template-columns:repeat(2,52px);grid-auto-rows:52px;gap:4px}
.mobile-actions [data-key="e"]{grid-column:1 / span 2;justify-self:center}
.mobile-key{width:52px;height:52px;padding:0;border:1.5px solid var(--ink);background:#f7f7f2;color:var(--ink);box-shadow:3px 3px 0 var(--ink);font:18px "DM Mono",ui-monospace,monospace;font-weight:500;line-height:1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.mobile-key.action{background:var(--red);color:#fff;border-color:var(--ink)}
.mobile-key.is-locked{display:none}
.mobile-key.pressed,.mobile-key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
@media(max-width:650px){.shell{min-height:420px}.topbar{top:16px;left:16px;right:16px}.egg-count{padding:9px 12px;font-size:11px}.hit-message{top:82px;width:calc(100% - 32px);font-size:clamp(26px,7vw,36px)}.story{padding:20px}.story-text{max-width:92%;font-size:16px}.modal{padding:25px 20px}.paint-panel{left:10px;gap:12px}.paint-tool{min-width:92px;padding:8px 7px;font-size:11px}.paint-confirm{padding:9px 14px}}
@media(max-width:650px){.mobile-dpad,.mobile-actions{bottom:clamp(16px,5vh,42px);grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);grid-auto-rows:44px;gap:3px}.mobile-actions{grid-template-columns:repeat(2,44px)}.mobile-key{width:44px;height:44px;font-size:16px}}
</style>
</head>

  function showEnd(win,caughtByHand=false){resetFriedEggDrop();titleEl.textContent=caughtByHand?"被做成荷包蛋了":win?"成功逃出！":"无蛋生还";modalNoteEl.classList.toggle("show",!win&&!caughtByHand);textEl.textContent=caughtByHand?(showSaucesAfterRestart?"按R或F键试试":"按E键，击飞别的蛋，或许能让“人”换个鸡蛋拿走"):win?"混战结束了，你还站着。冰箱门开了。":"按R或F键试试";if(caughtByHand)mobileEUnlocked=true;else if(!win)mobileRfUnlocked=true;updateMobileControls();startBtn.textContent="新的蛋生轮回";veil.classList.remove("hide");if(caughtByHand)startFriedEggDrop()}
  function drawNoise(t){if(noiseLevel<=0)return;ctx.save();const grainCount=1200+Math.floor(noiseLevel*2600),grainAlpha=.08+noiseLevel*.22;ctx.globalAlpha=grainAlpha;for(let i=0;i<grainCount;i++){const shade=Math.floor(rand(55,235));ctx.fillStyle=`rgb(${shade},${shade},${Math.min(245,shade+rand(-3,8))})`;const size=rand(.35,2.1)*(noiseLevel>.65?1.25:1);ctx.fillRect(Math.random()*W,Math.random()*H,size,size)}ctx.globalAlpha=.035+noiseLevel*.075;ctx.fillStyle="#302d27";for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);const scratchCount=1+Math.floor(noiseLevel*7);for(let i=0;i<scratchCount;i++){const x=rand(0,W),y=rand(-H*.2,H*.7),length=rand(H*.15,H*.85);ctx.globalAlpha=rand(.025,.08)+noiseLevel*.06;ctx.fillRect(x,y,rand(.5,1.6),length)}const dustCount=4+Math.floor(noiseLevel*16);for(let i=0;i<dustCount;i++){ctx.globalAlpha=rand(.05,.16)+noiseLevel*.08;ctx.beginPath();ctx.arc(rand(0,W),rand(0,H),rand(1,4.5),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=(.018+noiseLevel*.04)*(Math.sin(t*18)+1);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.restore()}
  function drawGameplayScene(t){drawFridge();drawArenaTrapezoid();drawShadow(t);eggs.slice().sort((a,b)=>eggDepth(a)-eggDepth(b)).forEach(e=>{if(e.player){const p={...e,x:player.x,y:player.y,jump:player.z};drawEgg(p,t)}else drawEgg(e,t)});if(showSaucesAfterRestart)drawSauces(t);drawHand()}
  function draw(t){ctx.save();if(shake>0&&!paintStoryMode)ctx.translate(rand(-shake,shake),rand(-shake,shake));ctx.translate(W*.5,H*.5);ctx.scale(VIEW_ZOOM,VIEW_ZOOM);ctx.translate(-W*.5,-H*.5);if(paintStoryMode)drawPaintStory(t);else if(state==="painting")drawPaintingScene(t);else drawGameplayScene(t)
    // impact streaks
    if(!paintStoryMode&&player.hit>0){const cam=camera();ctx.save();ctx.translate(W*.5+player.x-cam.x,H*.59+player.y-cam.y-player.z);ctx.strokeStyle="#171919";ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(Math.cos(player.face+i*.42)*32,Math.sin(player.face+i*.42)*27);ctx.lineTo(Math.cos(player.face+i*.42)*rand(45,72),Math.sin(player.face+i*.42)*rand(38,58));ctx.stroke()}ctx.restore()}
    if(!paintStoryMode&&flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*1.3})`;ctx.fillRect(0,0,W,H)}
    if(!paintStoryMode&&horrorFlash>0){ctx.fillStyle=`rgba(255,255,255,${horrorFlash})`;ctx.fillRect(0,0,W,H)}
    if(!paintStoryMode)drawNoise(t);
    ctx.restore()}
  function loop(now){if(!["win","lose"].includes(state)){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt,now/1000);draw(now/1000);if(!["win","lose"].includes(state))requestAnimationFrame(loop)}}
})();
</script>
